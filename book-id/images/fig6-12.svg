<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 40 780 420" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="340" height="180" x="35" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="205" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tools operasi GUI (komputer)</text><text x="47" y="98" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Mouse:</text><text x="105" y="98" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">mouse_move · left/right/middle_click</text><text x="105" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">double/triple_click · left_click_drag</text><text x="105" y="130" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">left_mouse_down/up</text><text x="47" y="152" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tombol:</text><text x="105" y="152" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">type (karakter demi karakter, interval 12ms)</text><text x="105" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">key (tombol kombinasi) · hold_key (tekan lama)</text><text x="47" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Gulir:</text><text x="105" y="190" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">gulir 4 arah + tombol pengubah</text><rect width="345" height="100" x="400" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="572" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tindakan persepsi</text><text x="412" y="98" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Layar:</text><text x="470" y="98" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">tangkapan layar → skalakan ke resolusi pelatihan</text><text x="412" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Kursor:</text><text x="470" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">cursor_position → (x, y)</text><text x="412" y="142" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tunggu:</text><text x="470" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">wait → tunggu antarmuka stabil</text><rect width="345" height="65" x="400" y="175" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="572" y="195" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Eksekusi perintah (bash)</text><text x="412" y="213" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Istilah:</text><text x="470" y="213" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">sesi bash persisten · waktu habis 120d</text><text x="470" y="229" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Deteksi string sentinel selesai</text><rect width="340" height="65" x="35" y="255" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="205" y="275" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Pengeditan file (str_replace_editor)</text><text x="47" y="293" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Ops:</text><text x="105" y="293" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">view · create · str_replace</text><text x="105" y="309" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">insert · undo_edit</text><rect width="345" height="65" x="400" y="255" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="572" y="275" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mekanisme penskalaan koordinat</text><text x="572" y="295" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">resolusi aktual ↔ resolusi pelatihan (XGA/WXGA/FWXGA)</text><text x="572" y="310" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">pengecilan tangkapan layar → inferensi model → pembesaran koordinat → eksekusi xdotool</text><rect width="710" height="110" x="35" y="335" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Alur eksekusi tipikal: isi formulir</text><text x="123" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">① tangkapan layar</text><text x="123" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Tangkap halaman</text><line x1="186" x2="196" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="259" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">② Inferensi model</text><text x="259" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Temukan bidang nama</text><line x1="322" x2="332" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="387" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">③ mouse_move</text><text x="387" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Pindah ke (324, 156)</text><line x1="458" x2="468" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="531" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">④ left_click</text><text x="531" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Klik untuk mendapatkan fokus</text><line x1="594" x2="604" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="667" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⑤ type</text><text x="667" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;John Smith&quot;</text><text x="390" y="430" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Setiap interval tindakan 2-5d (serial tangkapan layar-kenali-pikirkan-klik), 1/3 hingga 1/5 kecepatan manusia</text></svg>